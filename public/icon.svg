<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D150D" />
      <stop offset="50%" stop-color="#1A0B06" />
      <stop offset="100%" stop-color="#120703" />
    </linearGradient>

    <!-- Warm Caramel & Terracotta Gradient -->
    <linearGradient id="brand-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA45B" />
      <stop offset="40%" stop-color="#E87A36" />
      <stop offset="100%" stop-color="#C05018" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#663A26" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#brand-warm)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Steam Aromas (Heart-Shaped Steam) -->
  <g filter="url(#soft-glow)">
    <!-- Left Steam -->
    <path d="M 215 170 C 200 135, 230 105, 215 80 C 210 70, 222 72, 225 85 C 235 115, 210 140, 225 170 Z" 
          fill="url(#gold-grad)" opacity="0.85" />
    <!-- Center Heart Steam -->
    <path d="M 256 160 C 240 120, 275 95, 256 68 C 238 95, 272 120, 256 160 Z" 
          fill="url(#gold-grad)" opacity="0.95" />
    <!-- Right Steam -->
    <path d="M 297 170 C 312 135, 282 105, 297 80 C 302 70, 290 72, 287 85 C 277 115, 302 140, 287 170 Z" 
          fill="url(#gold-grad)" opacity="0.85" />
  </g>

  <!-- Gourmet Bowl / Cloche Base -->
  <g>
    <!-- Rim Shadow -->
    <ellipse cx="256" cy="305" rx="146" ry="24" fill="#0E0502" opacity="0.6" />

    <!-- Dome / Cloche Main Body -->
    <path d="M 124 300 C 124 195, 388 195, 388 300 Z" 
          fill="url(#brand-warm)" />

    <!-- Cloche Rim Base -->
    <path d="M 112 300 C 112 292, 400 292, 400 300 C 400 316, 112 316, 112 300 Z" 
          fill="url(#gold-grad)" />

    <!-- Cloche Top Knob -->
    <circle cx="256" cy="192" r="14" fill="url(#gold-grad)" />

    <!-- Stylized Monogram "A" inside Cloche -->
    <path d="M 256 216 L 286 285 L 268 285 L 261 268 L 251 268 L 244 285 L 226 285 Z M 256 242 L 253 254 L 259 254 Z" 
          fill="#FAF7F2" font-weight="900" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="375" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="5" 
        fill="#FAF7F2">
    AMANDITA
  </text>

  <text x="256" y="415" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="18" 
        letter-spacing="9" 
        fill="url(#gold-grad)">
    SABORES
  </text>

  <!-- Bottom Accent Dots -->
  <circle cx="216" cy="442" r="3.5" fill="#C86D3B" />
  <circle cx="256" cy="442" r="4.5" fill="#FFCA28" />
  <circle cx="296" cy="442" r="3.5" fill="#C86D3B" />
</svg>
